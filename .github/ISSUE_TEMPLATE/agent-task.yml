name: Agent Task
description: Scoped implementation task for Copilot/Codex agents
title: "[Agent Task]: "
labels: ["status:backlog"]
body:
  - type: input
    id: layer
    attributes:
      label: Layer
      placeholder: "layer:01-scaffold"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      placeholder: "Budget Dashboard / Activity Database / Shared Services"
    validations:
      required: true
  - type: input
    id: impact
    attributes:
      label: Impact Level
      placeholder: "impact:1-isolated"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be changed?
    validations:
      required: true
  - type: textarea
    id: must_not_touch
    attributes:
      label: Must Not Touch
      description: Files, layers, or modules that are out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: meaningful_tests_required
    attributes:
      label: Meaningful Tests Required
      description: List behavior and contract tests required for this task.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Required contracts, services, or prerequisite tasks.
    validations:
      required: true
  - type: textarea
    id: followups
    attributes:
      label: Follow-Up Work
      description: Out-of-scope findings that should become separate tasks.
    validations:
      required: true