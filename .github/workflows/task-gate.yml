name: Task Gate

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Maintainer switch: update only this label to advance rollout unlocks.
      # Keep gate logic unchanged when moving to the next layer.
      UNLOCKED_LAYER_LABEL: layer:01-scaffold
    steps:
      - name: Check issue layer labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          echo "$labels"

          # Only issues in $UNLOCKED_LAYER_LABEL may remain status:ready.
          if echo "$labels" | grep -q "status:ready"; then
            if ! echo "$labels" | grep -qF "$UNLOCKED_LAYER_LABEL"; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "status:ready" --add-label "status:blocked"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Blocked by task gate: only ${UNLOCKED_LAYER_LABEL} is currently unlocked."
            fi
          fi